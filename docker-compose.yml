services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdoor}
      POSTGRES_USER: ${POSTGRES_USER:-smartdoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smartdoor -d smartdoor"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt:
    profiles: [sim]
    image: eclipse-mosquitto:2.0
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdoor}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-smartdoor}?sslmode=disable
      MQTT_URL: ${MQTT_URL:-ssl://test.mosquitto.org:8886}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:?Set a unique MQTT_TOPIC_PREFIX in .env}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-smart-door-api}
      API_ADDR: :8080
      FACE_AI_URL: ${FACE_AI_URL:-http://face-ai:8000}
      VISITOR_ANALYSIS_MODE: ${VISITOR_ANALYSIS_MODE:-off}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  face-ai:
    profiles: [enrollment]
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      YUNET_MODEL_PATH: /models/face_detection_yunet_2023mar.onnx
      SFACE_MODEL_PATH: /models/face_recognition_sface_2021dec.onnx
      FACE_MODEL_VERSION: ${FACE_MODEL_VERSION:-local-sface-2021dec}
    volumes:
      - ${FACE_MODELS_DIR:-./models}:/models:ro
  simulator:
    profiles: [sim]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["simulator"]
    environment:
      MQTT_URL: tcp://mqtt:1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:?Set a unique MQTT_TOPIC_PREFIX in .env}
      SIMULATOR_CLIENT_ID: smart-door-simulator-local
    depends_on:
      mqtt: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  db-data:
