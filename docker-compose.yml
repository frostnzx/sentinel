services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdoor}
      POSTGRES_USER: ${POSTGRES_USER:-smartdoor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoor -d smartdoor"]
      interval: 3s
      timeout: 3s
      retries: 20
  mqtt:
    image: eclipse-mosquitto:2.0
    ports: ["1883:1883"]
    volumes: ["./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdoor}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-smartdoor}?sslmode=disable
      MQTT_URL: tcp://mqtt:1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-school-demo}
      MQTT_CLIENT_ID: smart-door-api-local
      API_ADDR: :8080
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_healthy }
  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["simulator"]
    environment:
      MQTT_URL: tcp://mqtt:1883
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-school-demo}
      SIMULATOR_CLIENT_ID: smart-door-simulator-local
    depends_on:
      mqtt: { condition: service_healthy }
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  db-data:
